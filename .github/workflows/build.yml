name: Build fOS Simulator

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 37.1
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.2

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk fOS-Simulator-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: fOS-Simulator-debug
          path: fOS-Simulator-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" fOS-Simulator-debug.apk \
            --title "fOS Simulator ${GITHUB_REF_NAME}" \
            --generate-notes
